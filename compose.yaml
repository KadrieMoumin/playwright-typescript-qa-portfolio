services:
  tests:
    # Match GitHub-hosted Linux runners when rendering screenshot baselines.
    platform: linux/amd64
    build: .
    init: true
    ipc: host
    environment:
      TASK_DATA_DIR: /app/data
      CI: "1"
    volumes:
      - task-data:/app/data
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

volumes:
  task-data:

rules:
  - id: no-dynamic-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not execute strings as code. Replace eval/Function with explicit logic.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
  - id: no-html-string-insertion
    languages: [javascript, typescript]
    severity: ERROR
    message: Use textContent and DOM nodes instead of inserting HTML strings.
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML(...)
  - id: no-disabled-tls-verification
    languages: [javascript, typescript]
    severity: ERROR
    message: Keep TLS certificate verification enabled.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: '{rejectUnauthorized: false, ...}'

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QA Task List</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; color: #18212f; background: #fff; }
main { max-width: 640px; margin: 0 auto; }
form { display: flex; flex-wrap: wrap; gap: 8px; }
form > label { flex-basis: 100%; }
#task { flex: 1 1 160px; min-width: 0; }
input, button { font: inherit; }
button, #task { min-height: 44px; padding: 8px 12px; }
button { color: #18212f; background: #eef2f6; border: 1px solid #667085; border-radius: 4px; }
ul { list-style: none; padding: 0; }
li { display: flex; align-items: flex-start; gap: 8px; margin: 12px 0; }
li label { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; min-height: 44px; padding: 8px 0; }
li input { width: 24px; height: 24px; flex-shrink: 0; margin: 0; }
li span { min-width: 0; overflow-wrap: anywhere; }
li button { flex-shrink: 0; }
:focus-visible { outline: 3px solid #165dcc; outline-offset: 3px; }
</style>
<main>
<h1>Task list</h1><form><label for="task">New task</label><input id="task" required maxlength="500"><button>Add task</button></form>
<div role="alert" hidden></div><button id="retry" type="button" hidden>Retry</button>
<p role="status">0 tasks remaining</p><ul aria-label="Tasks"></ul>
</main>
<script src="/client.js"></script></html>
